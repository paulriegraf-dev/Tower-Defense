	<div id="kante"></div>
	<div id="leiste"><div></div></div>
	<div id="text">Lädt das Spiel …<small>Beim ersten Mal dauert es etwas – danach kommt es aus dem Browser-Speicher.</small></div>
	<div id="fehler"></div>
</div>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":11664352,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const lade = document.getElementById('lade');
	const voll = document.getElementById('logo-voll');
	const kante = document.getElementById('kante');
	const leiste = document.querySelector('#leiste div');
	const text = document.getElementById('text');
	const fehler = document.getElementById('fehler');
	const LOGO_OBEN = 18.06, LOGO_HOEHE = 57.22, LOGO_ZEILEN = 103;
	let gezeigt = 0;      // angezeigter Anteil 0..0.97 (voll erst, wenn das Spiel wirklich startet)
	let ziel = 0.03;

	function mb(n) { return (n / 1048576).toFixed(0); }

	function zeige(anteil) {
		// in ganzen Logo-Pixelzeilen füllen, wie im Spiel
		const zeilen = Math.floor(LOGO_ZEILEN * anteil);
		const oben = 100 - (zeilen / LOGO_ZEILEN) * 100;
		voll.style.clipPath = 'inset(' + oben + '% 0 0 0)';
		kante.style.top = (LOGO_OBEN + LOGO_HOEHE * (1 - zeilen / LOGO_ZEILEN)) + '%';
		kante.style.display = anteil >= 1 ? 'none' : 'block';
		leiste.style.width = (anteil * 100) + '%';
	}

	// sanft nachziehen, damit die Füllung nicht springt
	(function schritt() {
		gezeigt += (ziel - gezeigt) * 0.15;
		zeige(gezeigt);
		if (lade.isConnected) requestAnimationFrame(schritt);
	}());

	function fertig() {
		ziel = 1; gezeigt = 1; zeige(1);
		setTimeout(function () {
			lade.style.opacity = '0';
			setTimeout(function () { lade.remove(); }, 400);
		}, 150);
	}

	function scheitern(err) {
		console.error(err);
		fehler.textContent = (err instanceof Error) ? err.message : (typeof err === 'string' ? err : 'Unbekannter Fehler beim Laden.');
		fehler.style.display = 'block';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		scheitern('Dein Browser kann das Spiel nicht starten. Es fehlt:\n' + missing.join('\n'));
		return;
	}
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				// Download: bis 90 %, der Rest ist das Starten der Engine
				ziel = Math.max(ziel, 0.9 * current / total);
				if (current >= total) {
					text.firstChild.textContent = 'Startet …';
					ziel = Math.max(ziel, 0.95);
				} else {
					text.firstChild.textContent = 'Lädt das Spiel … ' + mb(current) + ' von ' + mb(total) + ' MB';
				}
			}
		},
	}).then(fertig, scheitern);
}());
</script>
