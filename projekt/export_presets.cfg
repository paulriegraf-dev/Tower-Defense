[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="Phantom Dateien/*.json, Phantom Dateien/*/*.json, karten/*.json"
exclude_filter="LIESMICH.md"
export_path="../td-web/index.html"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<link rel=\"manifest\" href=\"manifest.json\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-title\" content=\"TD Battler\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">
<meta name=\"theme-color\" content=\"#140a22\">
<script>(function(){var m=document.querySelector(\"meta[name=viewport]\");if(m){m.content=\"width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover\";}})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
